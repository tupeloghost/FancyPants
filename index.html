<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOUNDWORLDS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --accent-h: 210;
    --accent: hsl(var(--accent-h), 90%, 65%);
    --accent-soft: hsla(var(--accent-h), 90%, 65%, 0.16);
    --accent-line: hsla(var(--accent-h), 80%, 65%, 0.28);
    --ink: hsl(var(--accent-h), 40%, 90%);
    --ink-dim: hsl(var(--accent-h), 25%, 62%);
    --ink-faint: hsl(var(--accent-h), 20%, 42%);
    --glass: hsla(228, 40%, 6%, 0.72);
    --well: hsla(var(--accent-h), 35%, 55%, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; }

  /* ── Panel ── */
  #panel {
    position: fixed; top: 14px; right: 14px; z-index: 100;
    width: 264px; color: var(--ink);
    font: 11.5px/1.5 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    background: var(--glass);
    border: 1px solid var(--accent-line);
    border-radius: 14px;
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 hsla(var(--accent-h), 80%, 80%, 0.08);
    user-select: none;
    transition: opacity 0.25s;
  }
  #panel.hidden { display: none; }

  #panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; cursor: pointer;
  }
  #panel:not(.collapsed) #panel-head { border-bottom: 1px solid hsla(var(--accent-h), 60%, 65%, 0.12); }
  #panel.collapsed #panel-body { display: none; }
  #panel-title {
    font-weight: 700; font-size: 12px; letter-spacing: 2.5px; color: var(--accent);
    text-shadow: 0 0 12px hsla(var(--accent-h), 90%, 65%, 0.5);
  }
  #panel-stats { margin-left: auto; color: var(--ink-faint); font-size: 10.5px; letter-spacing: 0.5px; }
  #panel-stats b { color: var(--ink-dim); font-weight: 400; }
  #chev { color: var(--ink-faint); font-size: 9px; transition: transform 0.2s; }
  #panel.collapsed #chev { transform: rotate(-90deg); }

  #panel-body { padding: 12px 14px 13px; }

  .sect {
    font-size: 9px; letter-spacing: 2px; color: var(--ink-faint);
    margin: 14px 0 7px;
  }
  .sect:first-child { margin-top: 0; }

  .row { margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }

  /* ── Inputs ── */
  select, button {
    width: 100%; padding: 6px 9px; color: var(--ink);
    background: var(--well);
    border: 1px solid transparent;
    border-radius: 8px; font: inherit; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
                      linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
  }
  select:hover, button:hover { border-color: var(--accent-line); background-color: var(--accent-soft); }
  select:focus, button:focus { outline: none; border-color: var(--accent-line); }
  select option { background: #0a0f1c; color: var(--ink); }

  button.on {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    color: var(--accent);
  }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; }

  /* file picker — hide native chrome behind a styled label */
  #file-input { display: none; }
  #file-label {
    display: block; width: 100%; padding: 6px 9px;
    background: var(--well); border: 1px solid transparent; border-radius: 8px;
    color: var(--ink-dim); cursor: pointer; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color 0.15s, background 0.15s;
  }
  #file-label:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }

  /* ── Transport ── */
  #transport { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  #btn-play {
    width: 34px; height: 34px; flex: none; padding: 0;
    border-radius: 50%; font-size: 12px;
    background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  #btn-play:hover { background: hsla(var(--accent-h), 90%, 65%, 0.28); }
  #transport-right { flex: 1; min-width: 0; }
  #time-label { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 10px; margin-top: 2px; }

  /* ── Sliders ── */
  .slider label {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--ink-dim); margin-bottom: 1px; font-size: 10.5px;
  }
  .slider label .val { color: var(--ink); font-size: 10.5px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), hsla(var(--accent-h), 30%, 60%, 0.18) var(--fill, 50%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; margin-top: -4px;
    border-radius: 50%; background: var(--ink);
    border: none;
    box-shadow: 0 0 8px hsla(var(--accent-h), 90%, 65%, 0.6);
    transition: transform 0.1s;
  }
  input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.25); background: #fff; }
  input[type="range"]::-moz-range-track {
    height: 3px; border-radius: 2px; background: hsla(var(--accent-h), 30%, 60%, 0.18);
  }
  input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border: none; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 8px hsla(var(--accent-h), 90%, 65%, 0.6);
  }

  /* hue slider gets a spectrum track */
  #hue::-webkit-slider-runnable-track {
    background: linear-gradient(to right, hsl(0,70%,55%), hsl(60,70%,55%), hsl(120,70%,55%), hsl(180,70%,55%), hsl(240,70%,55%), hsl(300,70%,55%), hsl(360,70%,55%));
  }
  #hue::-moz-range-track {
    background: linear-gradient(to right, hsl(0,70%,55%), hsl(60,70%,55%), hsl(120,70%,55%), hsl(180,70%,55%), hsl(240,70%,55%), hsl(300,70%,55%), hsl(360,70%,55%));
  }
  #hue::-moz-range-progress { background: transparent; }

  .hint {
    color: var(--ink-faint); font-size: 9.5px; margin-top: 12px; text-align: center;
    letter-spacing: 0.3px;
  }
  .hint kbd {
    font: inherit; color: var(--ink-dim);
    background: var(--well); border-radius: 4px; padding: 1px 5px;
  }

  /* ── Start overlay ── */
  #tap-to-start {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: radial-gradient(ellipse at center, rgba(2,4,12,0.35), rgba(0,0,0,0.75));
    color: var(--ink-dim); cursor: pointer;
    font: 13px/1.6 'SF Mono', ui-monospace, Menlo, monospace; letter-spacing: 3px;
    opacity: 1; transition: opacity 0.5s;
  }
  #tap-to-start.gone { opacity: 0; pointer-events: none; }
  #tap-to-start .big {
    font-size: 34px; font-weight: 700; letter-spacing: 10px; color: var(--accent);
    text-shadow: 0 0 40px hsla(var(--accent-h), 90%, 65%, 0.9), 0 0 90px hsla(var(--accent-h), 90%, 55%, 0.5);
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="tap-to-start">
  <div class="big">SOUNDWORLDS</div>
  <div>click anywhere · then pick a track</div>
</div>

<div id="panel">
  <div id="panel-head">
    <span id="chev">▼</span>
    <span id="panel-title">SOUNDWORLDS</span>
    <span id="panel-stats"><b id="fps">--</b> fps · <b id="pcount">1</b>p</span>
  </div>
  <div id="panel-body">

    <div class="sect">TRACK</div>
    <div class="row">
      <select id="track-select"><option value="">choose from /audio/ …</option></select>
    </div>
    <div class="row">
      <label id="file-label" for="file-input">⬆ load local file</label>
      <input type="file" id="file-input" accept="audio/*">
    </div>

    <div id="transport">
      <button id="btn-play" title="play/pause">▶</button>
      <div id="transport-right">
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <div id="time-label"><span id="time-cur">0:00</span><span id="time-dur">0:00</span></div>
      </div>
    </div>
    <div class="row slider">
      <label>volume <span class="val" id="vol-val">80</span></label>
      <input type="range" id="volume" min="0" max="100" value="80">
    </div>

    <div class="sect">WORLD</div>
    <div class="row">
      <select id="world-select"></select>
    </div>
    <div class="row btnrow">
      <button id="btn-attract" class="on">ATTRACT</button>
      <button id="btn-interactive">PLAY</button>
    </div>

    <div class="sect">TUNE</div>
    <div class="row slider">
      <label>reactivity <span class="val" id="react-val">1.0</span></label>
      <input type="range" id="reactivity" min="0" max="200" value="100">
    </div>
    <div class="row slider">
      <label>beat sensitivity <span class="val" id="beat-val">1.40</span></label>
      <input type="range" id="beat-sens" min="105" max="250" value="140">
    </div>
    <div class="row slider">
      <label>smoothing <span class="val" id="smooth-val">0.70</span></label>
      <input type="range" id="smoothing" min="0" max="95" value="70">
    </div>
    <div class="row slider">
      <label>hue <span class="val" id="hue-val">210</span></label>
      <input type="range" id="hue" min="0" max="360" value="210">
    </div>

    <div class="hint"><kbd>H</kbd> hide · <kbd>C</kbd> collapse · <kbd>space</kbd> play</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
