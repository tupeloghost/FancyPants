<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02040c">
<title>Fancy Pants</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --accent-h: 210;
    --accent: hsl(var(--accent-h), 90%, 65%);
    --accent-soft: hsla(var(--accent-h), 90%, 65%, 0.16);
    --accent-line: hsla(var(--accent-h), 80%, 65%, 0.28);
    --ink: hsl(var(--accent-h), 40%, 90%);
    --ink-dim: hsl(var(--accent-h), 25%, 62%);
    --ink-faint: hsl(var(--accent-h), 20%, 42%);
    --glass: hsla(228, 40%, 6%, 0.72);
    --well: hsla(var(--accent-h), 35%, 55%, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { cursor: none; }
  #panel, #panel * { cursor: default; }
  #panel select, #panel button, #panel input, #panel label, #panel #panel-head { cursor: pointer; }
  #canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ── Custom cursor ── */
  #cursor {
    position: fixed; left: 0; top: 0; z-index: 300;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0; transition: opacity 0.2s;
  }
  #cursor.live { opacity: 1; }
  #cursor .core {
    position: absolute; inset: 9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px hsla(var(--accent-h), 95%, 70%, 0.95);
  }
  #cursor .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px dashed hsla(var(--accent-h), 90%, 70%, 0.9);
    box-shadow: 0 0 14px hsla(var(--accent-h), 90%, 60%, 0.5), inset 0 0 8px hsla(var(--accent-h), 90%, 60%, 0.35);
  }
  .cursor-ripple {
    position: fixed; left: 0; top: 0; z-index: 299;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%;
    border: 2px solid hsla(var(--accent-h), 95%, 70%, 0.9);
    box-shadow: 0 0 18px hsla(var(--accent-h), 90%, 60%, 0.7);
    pointer-events: none; mix-blend-mode: screen;
    animation: ripple 0.55s ease-out forwards;
  }
  @keyframes ripple {
    from { transform: scale(1); opacity: 1; }
    to   { transform: scale(4.5); opacity: 0; }
  }
  @media (pointer: coarse) {
    body { cursor: auto; }
    #cursor { display: none; }
  }


  /* ── Panel ── */
  #panel {
    position: fixed; top: 14px; right: 14px; z-index: 100;
    width: 264px; color: var(--ink);
    font: 11.5px/1.5 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    background: var(--glass);
    border: 1px solid var(--accent-line);
    border-radius: 14px;
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 hsla(var(--accent-h), 80%, 80%, 0.08);
    user-select: none;
    transition: opacity 0.25s;
  }
  #panel.hidden { display: none; }

  #panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; cursor: pointer;
  }
  #panel:not(.collapsed) #panel-head { border-bottom: 1px solid hsla(var(--accent-h), 60%, 65%, 0.12); }
  #panel.collapsed #panel-body { display: none; }
  #panel-title {
    font-weight: 700; font-size: 12px; letter-spacing: 2.5px; color: var(--accent);
    text-shadow: 0 0 12px hsla(var(--accent-h), 90%, 65%, 0.5);
  }
  #panel-stats { margin-left: auto; color: var(--ink-faint); font-size: 10.5px; letter-spacing: 0.5px; }
  #panel-stats b { color: var(--ink-dim); font-weight: 400; }
  #chev { color: var(--ink-faint); font-size: 9px; transition: transform 0.2s; }
  #panel.collapsed #chev { transform: rotate(-90deg); }

  #panel-body { padding: 12px 14px 13px; }

  .sect {
    font-size: 9px; letter-spacing: 2px; color: var(--ink-faint);
    margin: 14px 0 7px;
  }
  .sect:first-child { margin-top: 0; }

  #spectrum {
    display: block; width: 100%; height: 30px;
    border-radius: 7px; margin-bottom: 4px;
    background: var(--well);
  }

  .row { margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }

  #tabs {
    display: flex; gap: 4px; margin-bottom: 11px;
    background: var(--well); border-radius: 9px; padding: 3px;
  }
  #tabs .tab {
    flex: 1; background: transparent; border: none; border-radius: 7px;
    padding: 6px 0; color: var(--ink-faint); letter-spacing: 1px;
  }
  #tabs .tab.on {
    background: var(--accent-soft); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent-line);
  }
  .picked { color: var(--accent); letter-spacing: 0.5px; text-transform: none; }
  .chip-group {
    width: 100%; font-size: 8px; letter-spacing: 2px; color: var(--ink-faint);
    margin-top: 3px;
  }
  #hue-row { position: relative; }
  #hue-row.locked input { opacity: 0.25; pointer-events: none; }
  #hue-row.locked label { opacity: 0.4; }
  #hue-note {
    display: none; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.5px;
    margin-top: -3px;
  }
  #hue-row.locked #hue-note { display: block; }

  .tab-page { display: none; }
  .tab-page.on { display: block; animation: pagein 0.18s ease-out; }
  @keyframes pagein {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .chips {
    display: flex; flex-wrap: wrap; gap: 5px; padding: 2px;
    margin-bottom: 8px;
  }
  .chip {
    flex: none; width: 32px; height: 24px; border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.10); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 13px; line-height: 1;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    background-color: var(--well);
  }
  .chip:hover { transform: translateY(-2px) scale(1.08); border-color: rgba(255,255,255,0.45); }
  .chip-preset {
    width: auto; padding: 0 9px; font-size: 10px; letter-spacing: 0.5px;
    color: var(--ink); white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .chip.on {
    border-color: #fff;
    box-shadow: 0 0 10px hsla(var(--accent-h), 90%, 65%, 0.8);
    transform: scale(1.06);
  }
  .seg {
    display: flex; background: var(--well); border-radius: 9px; padding: 3px; gap: 3px;
  }
  .seg button {
    background: transparent; border: none; border-radius: 7px; padding: 5px 8px;
  }
  .seg button.on {
    background: var(--accent-soft); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent-line);
  }

  .grid2 {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 7px 10px; margin-bottom: 9px;
  }
  .mini-label {
    font-size: 9px; letter-spacing: 1.5px; color: var(--ink-faint);
    margin-bottom: 3px;
  }
  optgroup { background: #0a0f1c; color: var(--ink-faint); font-style: normal; }

  /* ── Inputs ── */
  select, button {
    width: 100%; padding: 6px 9px; color: var(--ink);
    background: var(--well);
    border: 1px solid transparent;
    border-radius: 8px; font: inherit; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
                      linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
  }
  select:hover, button:hover { border-color: var(--accent-line); background-color: var(--accent-soft); }
  select:focus, button:focus { outline: none; border-color: var(--accent-line); }
  select option { background: #0a0f1c; color: var(--ink); }

  button.on {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    color: var(--accent);
  }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; }

  /* file picker — hide native chrome behind a styled label */
  #file-input { display: none; }
  #file-label {
    display: block; width: 100%; padding: 6px 9px;
    background: var(--well); border: 1px solid transparent; border-radius: 8px;
    color: var(--ink-dim); cursor: pointer; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color 0.15s, background 0.15s;
  }
  #file-label:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }

  /* ── Transport ── */
  #transport { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  #btn-play {
    width: 34px; height: 34px; flex: none; padding: 0;
    border-radius: 50%; font-size: 12px;
    background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  #btn-play:hover { background: hsla(var(--accent-h), 90%, 65%, 0.28); }
  #transport-right { flex: 1; min-width: 0; }
  #time-label { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 10px; margin-top: 2px; }

  /* ── Sliders ── */
  .slider label {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--ink-dim); margin-bottom: 1px; font-size: 10.5px;
  }
  .slider label .val { color: var(--ink); font-size: 10.5px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), hsla(var(--accent-h), 30%, 60%, 0.18) var(--fill, 50%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; margin-top: -4px;
    border-radius: 50%; background: var(--ink);
    border: none;
    box-shadow: 0 0 8px hsla(var(--accent-h), 90%, 65%, 0.6);
    transition: transform 0.1s;
  }
  input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.25); background: #fff; }
  input[type="range"]::-moz-range-track {
    height: 3px; border-radius: 2px; background: hsla(var(--accent-h), 30%, 60%, 0.18);
  }
  input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border: none; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 8px hsla(var(--accent-h), 90%, 65%, 0.6);
  }

  /* hue slider gets a spectrum track */
  #hue::-webkit-slider-runnable-track {
    background: linear-gradient(to right, hsl(0,70%,55%), hsl(60,70%,55%), hsl(120,70%,55%), hsl(180,70%,55%), hsl(240,70%,55%), hsl(300,70%,55%), hsl(360,70%,55%));
  }
  #hue::-moz-range-track {
    background: linear-gradient(to right, hsl(0,70%,55%), hsl(60,70%,55%), hsl(120,70%,55%), hsl(180,70%,55%), hsl(240,70%,55%), hsl(300,70%,55%), hsl(360,70%,55%));
  }
  #hue::-moz-range-progress { background: transparent; }

  .hint {
    color: var(--ink-faint); font-size: 9.5px; margin-top: 12px; text-align: center;
    letter-spacing: 0.3px;
  }
  .hint kbd {
    font: inherit; color: var(--ink-dim);
    background: var(--well); border-radius: 4px; padding: 1px 5px;
  }

  /* ── Start overlay ── */
  #tap-to-start {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: radial-gradient(ellipse at center, rgba(2,4,12,0.35), rgba(0,0,0,0.75));
    color: var(--ink-dim); cursor: pointer;
    font: 13px/1.6 'SF Mono', ui-monospace, Menlo, monospace; letter-spacing: 3px;
    opacity: 1; transition: opacity 0.5s;
  }
  #tap-to-start.gone { opacity: 0; pointer-events: none; }
  #tap-to-start .big {
    font-size: 34px; font-weight: 700; letter-spacing: 10px; color: var(--accent);
    text-shadow: 0 0 40px hsla(var(--accent-h), 90%, 65%, 0.9), 0 0 90px hsla(var(--accent-h), 90%, 55%, 0.5);
    animation: breathe 3s ease-in-out infinite;
  }
  /* ── Join card ── */
  #join-card {
    display: flex; flex-direction: column; gap: 9px; width: 250px;
    letter-spacing: normal;
  }
  #join-card input {
    padding: 10px 12px; border-radius: 10px; text-align: center;
    background: rgba(10, 16, 30, 0.85); color: var(--ink);
    border: 1px solid var(--accent-line); font: 14px 'SF Mono', Menlo, monospace;
    letter-spacing: 2px; outline: none;
  }
  #join-card input:focus { border-color: var(--accent); box-shadow: 0 0 14px hsla(var(--accent-h), 90%, 65%, 0.4); }
  #join-card input::placeholder { color: var(--ink-faint); letter-spacing: 1px; }
  .join-row { display: flex; gap: 7px; }
  .join-row button {
    flex: 1; padding: 9px 0; border-radius: 10px; cursor: pointer;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-line);
    font: 700 12px 'SF Mono', Menlo, monospace; letter-spacing: 2px;
  }
  .join-row button:hover { background: hsla(var(--accent-h), 90%, 65%, 0.3); }
  #join-msg { color: #ff8fa3; font-size: 11px; min-height: 14px; letter-spacing: 1px; }

  /* room code — prominent, part of the broadcast frame */
  #room-badge {
    position: fixed; top: 16px; left: 18px; z-index: 90;
    font: 700 30px 'SF Mono', Menlo, monospace; letter-spacing: 7px;
    color: var(--accent);
    text-shadow: 0 0 18px hsla(var(--accent-h), 90%, 65%, 0.9), 0 0 50px hsla(var(--accent-h), 90%, 55%, 0.5);
    user-select: none; pointer-events: none;
  }
  #room-badge::before {
    content: 'ROOM'; display: block;
    font-size: 9px; letter-spacing: 4px; color: var(--ink-faint); text-shadow: none;
  }
  #room-badge.hidden { display: none; }

  /* participants overlay (P) */
  #plist {
    position: fixed; left: 18px; bottom: 18px; z-index: 90;
    background: var(--glass); border: 1px solid var(--accent-line); border-radius: 12px;
    padding: 10px 12px; color: var(--ink); width: 200px;
    font: 11px 'SF Mono', Menlo, monospace;
    backdrop-filter: blur(14px);
  }
  #plist.hidden { display: none; }
  .plist-title { color: var(--ink-faint); font-size: 9px; letter-spacing: 1px; margin-bottom: 6px; }
  .plist-row { padding: 3px 6px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  .plist-row:hover { background: var(--accent-soft); }
  .plist-row.muted { opacity: 0.4; text-decoration: line-through; }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }
  /* ── Phone layout: the viewer's controller ── */
  @media (max-width: 620px) {
    #panel {
      top: auto; bottom: 10px; left: 10px; right: 10px;
      width: auto; max-height: 62vh; overflow-y: auto;
      border-radius: 16px;
    }
    /* 16px stops iOS from auto-zooming the page on focus */
    #join-card input { font-size: 16px; padding: 13px 12px; }
    #join-card { width: min(320px, 82vw); }
    .join-row button { padding: 13px 0; font-size: 13px; }
    #room-badge { font-size: 22px; letter-spacing: 5px; }
    #tap-to-start .big { font-size: 26px; letter-spacing: 6px; }
    .chip { width: 36px; height: 28px; }
    .chip-preset { width: auto; }
    /* while the join card is up, small screens show only the join card */
    #tap-to-start:not(.gone) ~ #panel { display: none; }
  }

  /* touch devices of any size (incl. iPad): no-zoom inputs, roomier taps */
  @media (pointer: coarse) {
    #join-card input { font-size: 16px; }
    .join-row button { padding: 12px 0; }
    .chip:not(.chip-preset) { min-width: 34px; min-height: 27px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="cursor"><div class="ring"></div><div class="core"></div></div>

<div id="tap-to-start">
  <div class="big">FANCY PANTS</div>
  <div id="join-card">
    <input id="join-name" maxlength="14" placeholder="your name" autocomplete="off">
    <input id="join-room" maxlength="6" placeholder="room code" autocomplete="off">
    <div id="join-msg"></div>
    <div class="join-row">
      <button id="btn-join">JOIN</button>
      <button id="btn-host">HOST</button>
      <button id="btn-solo">SOLO</button>
    </div>
  </div>
</div>

<div id="room-badge" class="hidden"></div>

<div id="plist" class="hidden">
  <div class="plist-title">participants — click to hide a name</div>
  <div id="plist-rows"></div>
</div>

<div id="panel">
  <div id="panel-head">
    <span id="chev">▼</span>
    <span id="panel-title">FANCY PANTS</span>
    <span id="panel-stats"><b id="fps">--</b> fps · <b id="pcount">1</b>p</span>
  </div>
  <div id="panel-body">
    <div id="tabs">
      <button class="tab on" data-tab="music">&#9834; music</button>
      <button class="tab" data-tab="style">&#10022; style</button>
      <button class="tab" data-tab="tune">&#9881; tune</button>
    </div>

    <div class="tab-page on" id="page-music">
      <canvas id="spectrum" width="236" height="30"></canvas>
      <div class="row">
        <select id="track-select"><option value="">choose from /audio/ &hellip;</option></select>
      </div>
      <div class="row">
        <label id="file-label" for="file-input">&#11014; load local file</label>
        <input type="file" id="file-input" accept="audio/*">
      </div>
      <div id="transport">
        <button id="btn-play" title="play/pause">&#9654;</button>
        <div id="transport-right">
          <input type="range" id="scrub" min="0" max="1000" value="0">
          <div id="time-label"><span id="time-cur">0:00</span><span id="time-dur">0:00</span></div>
        </div>
      </div>
      <div class="row slider">
        <label>volume <span class="val" id="vol-val">80</span></label>
        <input type="range" id="volume" min="0" max="100" value="80">
      </div>
    </div>

    <div class="tab-page" id="page-style">
      <div class="row">
        <select id="world-select"></select>
      </div>
      <div class="row seg">
        <button id="btn-attract" class="on">&#9678; watch</button>
        <button id="btn-interactive">&#9654; play</button>
        <button id="btn-stardust" class="on">&#10022; dust</button>
      </div>
      <div class="mini-label">one-click looks</div>
      <div id="preset-chips" class="chips"></div>
      <div class="mini-label">colors &middot; <span class="picked" id="color-name">rainbow</span></div>
      <div id="color-chips" class="chips"></div>
      <div class="row slider" id="hue-row">
        <label>hue <span class="val" id="hue-val">210</span></label>
        <input type="range" id="hue" min="0" max="360" value="210">
        <div id="hue-note">this theme brings its own colors</div>
      </div>
      <div class="mini-label">pattern &middot; <span class="picked" id="pattern-name">spiral</span></div>
      <div id="pattern-chips" class="chips"></div>
      <div class="mini-label">shape &middot; <span class="picked" id="shape-name">slat</span></div>
      <div id="shape-chips" class="chips"></div>
    </div>

    <div class="tab-page" id="page-tune">
      <div class="grid2">
        <div class="slider">
          <label>reactivity <span class="val" id="react-val">1.0</span></label>
          <input type="range" id="reactivity" min="0" max="200" value="100">
        </div>
        <div class="slider">
          <label>beats <span class="val" id="beat-val">1.40</span></label>
          <input type="range" id="beat-sens" min="105" max="250" value="140">
        </div>
        <div class="slider">
          <label>smoothing <span class="val" id="smooth-val">0.70</span></label>
          <input type="range" id="smoothing" min="0" max="95" value="70">
        </div>
        <div class="slider">
          <label>bloom <span class="val" id="bloom-val">0.7</span></label>
          <input type="range" id="bloom" min="0" max="300" value="70">
        </div>
        <div class="slider">
          <label>hdr <span class="val" id="hdr-val">1.0</span></label>
          <input type="range" id="hdr" min="0" max="200" value="100">
        </div>
      </div>
      <div class="hint"><kbd>H</kbd> panel &middot; <kbd>B</kbd> broadcast &middot; <kbd>N</kbd> names &middot; <kbd>P</kbd> people &middot; <kbd>space</kbd> play &middot; <kbd>S</kbd> png</div>
    </div>
  </div>
</div>
